name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: choco install ffmpeg -y

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Empaquetar con PyInstaller
        run: |
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          pyinstaller `
            --name="AureaTranscribe" `
            --windowed `
            --noconfirm `
            --clean `
            --add-data="index.html;." `
            --add-binary="$ffmpeg;." `
            --add-binary="$ffprobe;." `
            --hidden-import=faster_whisper `
            --hidden-import=ctranslate2 `
            --hidden-import=flask `
            --hidden-import=docx `
            --hidden-import=reportlab `
            --hidden-import=reportlab.lib `
            --hidden-import=reportlab.platypus `
            --hidden-import=huggingface_hub `
            --hidden-import=tokenizers `
            --exclude-module=tkinter `
            --exclude-module=pyannote `
            main.py
        shell: pwsh

      - name: Crear ZIP del instalador
        run: Compress-Archive -Path "dist\AureaTranscribe\*" -DestinationPath "dist\AureaTranscribe-v1.0-Windows.zip"
        shell: pwsh

      - name: Subir ZIP a la release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: dist/AureaTranscribe-v1.0-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
