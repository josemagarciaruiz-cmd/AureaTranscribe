name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Empaquetar con PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --name="AureaTranscribe" `
            --windowed `
            --noconfirm `
            --clean `
            "--add-data=index.html;." `
            --hidden-import=faster_whisper `
            --hidden-import=flask `
            --hidden-import=flask_cors `
            --hidden-import=webview `
            --collect-all=faster_whisper `
            main.py

      - name: Crear ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\AureaTranscribe\*" -DestinationPath "dist\AureaTranscribe-Windows.zip"

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AureaTranscribe-Windows
          path: dist\AureaTranscribe-Windows.zip
          retention-days: 30
